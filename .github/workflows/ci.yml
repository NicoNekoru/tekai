name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-light:
    name: Rust and TeX lookup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Verify self-contained checks before installing TeX
        run: cargo test --locked --test cli_self_contained -- --include-ignored --test-threads=1

      - name: Verify native shared-tree lookup without installed TeX
        run: cargo test --locked --test cli_texmf -- --test-threads=1

      - name: Install TeX
        run: |
          brew install ghostscript poppler
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Require the real TeX reference gate
        env:
          TEKAI_REQUIRE_SYSTEM_TEX: "1"
        run: |
          kpsewhich --version
          pdflatex --version
          mktexlsr --version
          test -n "$(kpsewhich --progname=pdflatex xspace.sty)"
          cargo test --locked --test cli_texmf real_tex_installation -- --nocapture --test-threads=1

      - name: Run Rust checks
        run: |
          ci_cache_root="$RUNNER_TEMP/tekai-cache"
          export TEKAI_FORMAT_CACHE="$ci_cache_root/formats"
          export TEKAI_AUX_CACHE="$ci_cache_root/aux"
          export TEKAI_BIBTEX_CACHE="$ci_cache_root/bibtex"
          export TEKAI_ENGINE_CACHE="$ci_cache_root/engine"
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p tekai-engine --bin tekai-engine --no-default-features --features standalone-binary --locked -- -D warnings
          cargo build -p tekai-engine --bin tekai-engine --no-default-features --features standalone-binary --locked
          cargo test --workspace --locked -- --test-threads=1
