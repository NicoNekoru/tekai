name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Quick or full release diagnostics
        required: false
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-light:
    name: Rust and TeX lookup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Test diagnostic runner permissions and cleanup without compiling TeX
        run: |
          test -f tools/test_performance_ci.py
          test -f tools/test_verify_bundled_papers.py
          python3 -B -m unittest discover -s tools -p test_audit_runtime.py
          python3 -B -m unittest discover -s tools -p test_performance_ci.py
          python3 -B -m unittest discover -s tools -p test_verify_bundled_papers.py

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Verify self-contained checks before installing TeX
        run: cargo test --locked --test cli_self_contained -- --include-ignored --test-threads=1

      - name: Verify native shared-tree lookup without installed TeX
        run: cargo test --locked --test cli_texmf -- --test-threads=1

      - name: Verify lookup scaling and retention budgets without installed TeX
        run: |
          cargo test -p tekai-engine --lib --locked -- --test-threads=1
          cargo test --lib --locked watch::events:: -- --test-threads=1
          cargo test --lib --locked snapshots_follow_active_dependencies -- --test-threads=1
          cargo test --lib --locked a_rescan_event_forces_structural_fallback -- --test-threads=1

      - name: Install TeX
        run: |
          brew install ghostscript poppler
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Require the real TeX reference gate
        env:
          TEKAI_REQUIRE_SYSTEM_TEX: "1"
        run: |
          kpsewhich --version
          pdflatex --version
          mktexlsr --version
          test -n "$(kpsewhich --progname=pdflatex xspace.sty)"
          cargo test --locked --test cli_texmf real_tex_installation -- --nocapture --test-threads=1

      - name: Run Rust checks
        run: |
          ci_cache_root="$RUNNER_TEMP/tekai-cache"
          export TEKAI_FORMAT_CACHE="$ci_cache_root/formats"
          export TEKAI_AUX_CACHE="$ci_cache_root/aux"
          export TEKAI_BIBTEX_CACHE="$ci_cache_root/bibtex"
          export TEKAI_ENGINE_CACHE="$ci_cache_root/engine"
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p tekai-engine --bin tekai-engine --no-default-features --features standalone-binary --locked -- -D warnings
          cargo build -p tekai-engine --bin tekai-engine --no-default-features --features standalone-binary --locked
          cargo test --workspace --locked -- --test-threads=1

  performance-diagnostics:
    name: Release diagnostics (${{ inputs.performance_profile || 'quick' }})
    # Pull requests already trigger performance.yml directly. This same-commit
    # call also lets a branch's new workflow be checked through core CI dispatch.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read
    with:
      profile: ${{ inputs.performance_profile || 'quick' }}
