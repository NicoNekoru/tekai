[package]
name = "tekai-pdftex"
version = "0.6.0"
edition = "2024"
description = "Experimental TeX expansion and approximate PDF rendering for Tekai."
license = "MIT"
repository = "https://github.com/NicoNekoru/tekai"
publish = false

[lib]
name = "tekai_pdftex"
path = "src/lib.rs"

[dependencies]
flate2 = "1.0"
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
md-5 = "0.10"
png = "0.17"
tekai-engine = { path = "../tekai-engine", default-features = false }
