[package]
name = "tekai-engine"
version = "0.6.1"
edition = "2021"
description = "Self-contained exact TeX engine used by tekai."
license = "GPL-2.0-or-later"
repository = "https://github.com/NicoNekoru/tekai"
publish = false

[features]
standalone-binary = ["cli-supervisor"]
cli-supervisor = ["dep:signal-hook"]

[lib]
name = "tekai_engine"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "tekai-engine"
path = "src/bin/tekai-engine.rs"
required-features = ["standalone-binary"]

[[test]]
name = "standalone_cli"
path = "tests/standalone_cli.rs"
required-features = ["standalone-binary"]

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
libm = "0.2"
memchr = "2.8"
lopdf = { version = "0.35", default-features = false, features = ["nom_parser"] }
png = "0.17"
sha2 = "0.11"
tar = "0.4"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "stdio", "termios"] }
signal-hook = { version = "0.4", optional = true }

[dev-dependencies]
libz-rs-sys = { version = "0.6.5", features = ["gz"] }
proptest = { workspace = true }
syn = { version = "2.0", features = ["full", "visit"] }
